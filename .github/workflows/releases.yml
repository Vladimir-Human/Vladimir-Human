name: Свежие релизы

# M-WORKFLOW: R-RELEASES-FRESH (daily refresh), R-RELEASES-SAFE (tests first, README only)
on:
  schedule:
    - cron: "17 6 * * *"   # каждый день: релизы выходят по несколько в неделю
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: releases
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Проверить скрипт
        run: python3 -m unittest discover -s tests -v
      - name: Обновить блок релизов
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_releases.py
      - name: Закоммитить, если что-то изменилось
        run: |
          if git diff --quiet README.md; then
            echo "Без изменений"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Обновить блок релизов"
          git push
